services:
  # Backend Server
  - type: web
    name: suvidha-server
    env: node
    rootDirectory: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0" # Fix for self-signed certs in some DBs
      # Add other secrets (DATABASE_URL, CLERK keys, etc.) in the Render Dashboard
    disk:
      name: suvidha-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1

  # Frontend Client
  - type: web
    name: suvidha-client
    env: node
    rootDirectory: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: suvidha-server
          property: url
