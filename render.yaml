services:
  # Backend Server
  - type: web
    name: suvidha-server
    env: node
    rootDirectory: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      # Add other secrets (DATABASE_URL, CLERK keys, etc.) in the Render Dashboard

  # Frontend Client
  - type: web
    name: suvidha-client
    env: node
    rootDirectory: client
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
