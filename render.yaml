services:
  # Backend Server
  - type: web
    name: suvidha-server
    env: node
    buildCommand: "cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: "production"
      - key: NODE_TLS_REJECT_UNAUTHORIZED
        value: "0"
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: "urvakshtirle@gmail.com"
      - key: SMTP_FROM
        value: "urvakshtirle@gmail.com"
      - key: SMTP_FROM_NAME
        value: "Zelp"
      - key: SMTP_CONNECTION_TIMEOUT
        value: "10000"
      - key: SMTP_GREETING_TIMEOUT
        value: "10000"
      - key: SMTP_SOCKET_TIMEOUT
        value: "15000"
      - key: SMTP_PASS
        sync: false
    disk:
      name: suvidha-uploads
      mountPath: /opt/render/project/src/server/uploads
      sizeGB: 1

  # Frontend Client
  - type: web
    name: suvidha-client
    env: node
    buildCommand: "cd client && npm install && npm run build"
    startCommand: "cd client && npm start"
    envVars:
      - key: NODE_ENV
        value: "production"
